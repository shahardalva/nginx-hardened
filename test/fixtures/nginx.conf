# Custom configuration mounted into BOTH images by test/conftest.py.
# Loads every dynamic module the official image ships: if one is missing,
# nginx fails to start and the custom-config tests fail.
load_module modules/ngx_http_js_module.so;
load_module modules/ngx_stream_js_module.so;
load_module modules/ngx_http_geoip_module.so;
load_module modules/ngx_stream_geoip_module.so;
load_module modules/ngx_http_image_filter_module.so;
load_module modules/ngx_http_xslt_filter_module.so;

user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;

    js_import main from /etc/nginx/js/main.js;

    server {
        listen       80;
        server_name  localhost;
        root         /srv/site;

        add_header X-Compat-Test custom always;

        location / {
            index index.html;
        }

        location = /njs {
            js_content main.hello;
        }

        location = /upload {
            client_max_body_size    8m;
            client_body_buffer_size 8m;
            js_content main.body_size;
        }

        location = /small {
            client_max_body_size 1k;
            return 200 "ok\n";
        }
    }
}
